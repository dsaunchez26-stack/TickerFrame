<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickerframe — Real-time stock & options signals</title>
    <meta name="description" content="Institutional-grade scanner for stocks and options. Live signals, backtested scores, factor-weighted picks, and transparent performance tracking. Research and education only." />
    <meta name="author" content="Tickerframe" />
    <meta name="theme-color" content="#090b0a" />
    <script>
      // Apply the theme before first paint so there is no flash: the saved choice if there is one,
      // otherwise the system setting (dark if the system gives no preference).
      try {
        var saved = null;
        try { saved = localStorage.getItem('tf_theme'); } catch (e) {}
        var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
        if (light) {
          document.documentElement.classList.add('light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f8f7');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="canonical" href="https://tickerframe.app/" />

    <meta property="og:title" content="Tickerframe — Real-time stock & options signals" />
    <meta property="og:description" content="Institutional-grade scanner with live signals, factor-weighted scores, and transparent performance tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tickerframe" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tickerframe — Real-time stock & options signals" />
    <meta name="twitter:description" content="Live scanner with factor-weighted scores and honest performance tracking." />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
